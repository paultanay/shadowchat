services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shadowchat
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadowsecret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadowchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── NATS JetStream ───
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--cluster_name shadowchat --jetstream"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Coturn STUN/TURN Server ───
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    volumes:
      - ./infrastructure/turnserver.conf:/etc/turnserver.conf:ro
      - ./infrastructure/certs:/etc/turn/certs:ro
    restart: unless-stopped

  # ─── Go Signaling Backend ───
  signaling:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://shadow:shadowsecret@postgres:5432/shadowchat?sslmode=disable
      - TURN_SECRET=shadowchatdevsecretkey1234567890
      - JWT_SECRET=shadowchatdevjwtsecretkey9876543210
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ─── Next.js Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: wss://api.shadowchat.local/ws
        NEXT_PUBLIC_API_URL: https://api.shadowchat.local/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - signaling

  # ─── Nginx Reverse Proxy (TLS Termination) ───
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - signaling
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
