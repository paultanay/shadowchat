services:
  # ─── Go Signaling Backend (always runs) ───
  signaling:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-in-production}
      - TURN_URLS=${TURN_URLS:-}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Next.js Frontend (always runs) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SIGNALING_URL: ws://localhost:8081/ws
        NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
        NEXT_PUBLIC_API_PORT: "8081"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      signaling:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Redis presence cache (optional — enable with: --profile cache) ───
  redis:
    profiles: ["cache", "cluster"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── NATS message broker (optional — enable with: --profile cluster) ───
  nats:
    profiles: ["cluster"]
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--cluster_name shadowchat --jetstream"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Coturn STUN/TURN (optional — enable with: --profile turn) ───
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    volumes:
      - ./infrastructure/turnserver.conf:/etc/turnserver.conf:ro
      - ./infrastructure/certs:/etc/turn/certs:ro
    restart: unless-stopped

  # ─── Nginx Reverse Proxy (optional — enable with: --profile reverse-proxy) ───
  nginx:
    profiles: ["reverse-proxy"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - signaling
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
