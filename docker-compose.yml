services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shadowchat
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadowsecret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadowchat"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── NATS JetStream ───
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "--cluster_name shadowchat --jetstream"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Coturn STUN/TURN Server (optional — enable with: docker compose --profile turn up) ───
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6.2
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    volumes:
      - ./infrastructure/turnserver.conf:/etc/turnserver.conf:ro
      - ./infrastructure/certs:/etc/turn/certs:ro
    restart: unless-stopped

  # ─── Go Signaling Backend ───
  signaling:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgres://shadow:${POSTGRES_PASSWORD:-shadowsecret}@postgres:5432/shadowchat?sslmode=disable
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET is required}
      - TURN_URLS=turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp,turns:localhost:5349?transport=tcp
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Next.js Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SIGNALING_URL: ws://localhost:8080/ws
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - signaling
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Nginx Reverse Proxy (optional — enable with: docker compose --profile reverse-proxy up) ───
  nginx:
    profiles: ["reverse-proxy"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - signaling
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  redis-data:
