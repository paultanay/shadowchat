# turnserver.conf
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Authentication
use-auth-secret
static-auth-secret-file=/run/secrets/turn_secret

# TLS
cert=/etc/turn/certs/fullchain.pem
pkey=/etc/turn/certs/privkey.pem

# Security
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Performance
proc-quota=100
stale-nonce=600
max-bps=512000

# Realm
realm=shadowchat.local

# Fingerprinting
fingerprint
